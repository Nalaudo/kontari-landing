    <!-- Structured data: Organization + software + offers. FAQPage JSON-LD is
         injected at build time by scripts/prerender.mjs from src/lib/faqs.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://kontari.com.ar/#organization",
            "name": "Kontari",
            "url": "https://kontari.com.ar/",
            "logo": "https://kontari.com.ar/assets/kontari-logo.svg",
            "email": "contacto@kontari.com",
            "description": "Software de gestión para estudios contables y contadores independientes en Argentina.",
            "areaServed": {
              "@type": "Country",
              "name": "Argentina"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://kontari.com.ar/#website",
            "url": "https://kontari.com.ar/",
            "name": "Kontari",
            "inLanguage": "es-AR",
            "publisher": { "@id": "https://kontari.com.ar/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://kontari.com.ar/#software",
            "name": "Kontari",
            "operatingSystem": "Web",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Software de gestión para estudios contables",
            "inLanguage": "es-AR",
            "url": "https://kontari.com.ar/",
            "publisher": { "@id": "https://kontari.com.ar/#organization" },
            "description": "Plataforma que centraliza la cartera de clientes de un estudio contable: autocompletado AFIP/ARCA, bóveda de claves fiscales cifradas, Libro IVA Digital y liquidación, contabilidad completa, facturación electrónica ARCA, honorarios, tareas, documentación y un asistente de IA.",
            "featureList": [
              "Cartera de clientes centralizada",
              "Autocompletado de datos AFIP/ARCA por CUIT",
              "Bóveda de claves fiscales cifradas con AES-256-GCM",
              "Libro IVA Digital, liquidación mensual (F2051) y retenciones SICORE",
              "Contabilidad: plan de cuentas, diario, mayor, balances y cierre de ejercicio",
              "Facturación electrónica ARCA con CAE (WSFEv1 / WSCT)",
              "Honorarios y cobranza con Mercado Pago",
              "Gestión de vencimientos e impuestos por cliente",
              "Tareas, plantillas recurrentes y tablero kanban",
              "Asistente de IA integrado",
              "Portal para clientes con chat y carga de documentación"
            ],
            "offers": {
              "@type": "AggregateOffer",
              "priceCurrency": "ARS",
              "lowPrice": "20000",
              "highPrice": "580000",
              "offerCount": "3",
              "offers": [
                {
                  "@type": "Offer",
                  "name": "Plan Solo",
                  "price": "20000",
                  "priceCurrency": "ARS",
                  "description": "Para el contador que gestiona su propia cartera."
                },
                {
                  "@type": "Offer",
                  "name": "Plan Estudio",
                  "price": "36000",
                  "priceCurrency": "ARS",
                  "description": "Para estudios que trabajan en equipo, hasta 3 profesionales."
                },
                {
                  "@type": "Offer",
                  "name": "Plan Portal",
                  "price": "58000",
                  "priceCurrency": "ARS",
                  "description": "Suma la app para los clientes del estudio."
                }
              ]
            }
          }
        ]
      }
    </script>

    <!-- Apply persisted theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kontari-landing-theme");
          if (
            stored === "dark" ||
            (!stored &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
