<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontari — El sistema de gestión para estudios contables</title>
    <meta
      name="description"
      content="Kontari centraliza clientes, datos de AFIP/ARCA, claves fiscales y documentación de tu estudio contable en una sola plataforma segura, con un asistente de IA que responde sobre tu cartera, lee tus documentos y redacta por vos."
    />
    <meta name="theme-color" content="#141833" />
    <link rel="icon" href="/assets/k-logo.svg" type="image/svg+xml" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <!-- Apply persisted theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kontari-landing-theme");
          if (
            stored === "dark" ||
            (!stored &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
